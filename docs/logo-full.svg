<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Brain left -->
  <path d="M32,16 C32,16 24,15 20,20 C16,25 17,33 20,37 C18,40 17,45 19,49 C21,53 26,54 30,52 L32,53"
        fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.9)" stroke-width="2.3" stroke-linecap="round"/>
  <!-- Brain right -->
  <path d="M32,16 C32,16 40,15 44,20 C48,25 47,33 44,37 C46,40 47,45 45,49 C43,53 38,54 34,52 L32,53"
        fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.9)" stroke-width="2.3" stroke-linecap="round"/>
  <!-- Center -->
  <line x1="32" y1="17" x2="32" y2="51" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Left gyri -->
  <path d="M19,30 C22,28 24,31 23,34" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right gyri -->
  <path d="M45,30 C42,28 40,31 41,34" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Lightning bolt -->
  <polygon points="35,12 27,31 33,31 29,52 37,33 31,33" fill="#fbbf24"/>

  <!-- "Focus" text -->
  <text x="80" y="38" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#1f2937" letter-spacing="-0.5">Focus</text>
  <!-- "Brain" text in purple -->
  <text x="167" y="38" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="800" fill="url(#txt)" letter-spacing="-0.5">Brain</text>
  <!-- Tagline -->
  <text x="80" y="54" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#9ca3af" letter-spacing="0.3">Gestionnaire TDAH</text>
</svg>
